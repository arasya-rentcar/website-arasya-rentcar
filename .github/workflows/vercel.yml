name: Deploy to Vercel

# Builds and deploys the site with the Vercel CLI from GitHub Actions.
#
# Required repo secret: VERCEL_TOKEN_NEW (vercel.com/account/tokens).
# Supabase and other runtime env vars are set in the Vercel project settings;
# without them the public pages fall back to registry-snapshot.json.

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

concurrency:
  group: deploy-vercel
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_NEW }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Link Vercel project
        run: vercel link --yes --project website-arasya-rentcar --scope sutanariefs-projects-a26c91df --token="$VERCEL_TOKEN"
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
