project_id = "arasya-rentcar"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/admin"]
jwt_expiry = 3600
enable_refresh_token_rotation = true

# Content Studio is admin-only. Accounts are provisioned by `npm run db:seed`
# and gated by the `admins` allowlist — public sign-up must stay off.
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false
